<div class="container">
  <!-- Login Form Wrapper -->
  <div class="form-wrapper" id="loginForm">
    <h2>Login</h2>
    <form id="login">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <label><input type="checkbox" id="rememberMe"> Remember Me</label><br>
      <a href="#">Forgot Password?</a><br>
      <button type="submit">Login</button><br>
      <a href="#" onclick="showSignUpForm()">Don't have an account? Register</a>
    </form>
  </div>

  <!-- Sign-Up Form Wrapper (Initially Hidden) -->
  <div class="form-wrapper hidden" id="signUpForm">
     <form  action="sigup.php" method="post">
    <h2>Sign Up</h2>
    <form id="signUp">
      <input type="text" id="firstName" placeholder="First Name"  name="firstName" required><br>
      <input type="text" id="lastName" placeholder="Last Name" name="lastName" required><br>
      <input type="date" id="dob" placeholder="Date of Birth" name="dob"  required onchange="calculateAge()"><br>
      <input type="text" id="age" placeholder="Age" name="age"  readonly><br>
      <select id="studies" name="studies" required>
        <option value="" disabled selected>Choose Study</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Engineering">Engineering</option>
        <option value="Law">Law</option>
        <option value="Medicine">Medicine</option>
        <option value="Business">Business</option>
         <option value="languages">languages</option>
      </select><br>
      <select id="degree"  name="degree"  required>
        <option value="" disabled selected>Choose Degree</option>
        <option value="Bachelor's">Bachelor's</option>
        <option value="Master's">Master's</option>
        <option value="PhD">PhD</option>
        <option value="other">other</option>
      </select><br>
      <input type="email" id="signUpEmail" placeholder=" Edex Email" name="signUpEmail"  required><br>
      <input type="password" id="signUppassword" placeholder=" Edex password" name="signUppassword" required><br>
      <input type="tel" id="phoneNumber" placeholder="Phone Number (+123456789)"  name="phoneNumber" required><br>
      <!-- CAPTCHA (Example) -->
      <label for="captcha">Please verify: 5 + 2 = </label>
      <input type="text" id="captcha" required><br>
      <button type="submit">Sign Up</button>
    </form>
  </div>
</div>

<script>
  // Show the Sign-Up form when clicked
  function showSignUpForm() {
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('signUpForm').classList.remove('hidden');
  }

  // Calculate Age based on Date of Birth
  function calculateAge() {
    const dob = document.getElementById('dob').value;
    const dobDate = new Date(dob);
    const age = new Date().getFullYear() - dobDate.getFullYear();
    document.getElementById('age').value = age;
  }

  // Sample Captcha Validation (Simple)
  document.getElementById('signUp').addEventListener('submit', function (e) {
    const captchaInput = document.getElementById('captcha').value;
    if (captchaInput !== '8') {
      e.preventDefault();
      alert('Captcha incorrect!');
    }
  });
</script>
